[project]
name = "helix-agent-product"
version = "0.1.0"
description = "HELIX Product Agent: deployment and release correlation over analytics-engine tool calls"
requires-python = ">=3.11"
dependencies = ["helix-contracts", "helix-agent-analytics", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["helix_agent_product"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
