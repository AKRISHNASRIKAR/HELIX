[project]
name = "helix-agent-coordinator"
version = "0.1.0"
description = "HELIX Coordinator Agent: plans an investigation, delegates agent tasks, and synthesizes the result"
requires-python = ">=3.11"
dependencies = ["helix-contracts"]

[tool.hatch.build.targets.wheel]
packages = ["helix_agent_coordinator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
