[project]
name = "helix-agent-analytics"
version = "0.1.0"
description = "HELIX Analytics Agent: turns a question into analytics-engine tool calls and evidence-backed findings"
requires-python = ">=3.11"
dependencies = ["helix-contracts", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["helix_agent_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
