[project]
name = "helix-llm"
version = "0.1.0"
description = "Optional LLM client for HELIX agents (Anthropic Messages API with structured outputs, plus a fake for tests)"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.14,<3"]

[tool.hatch.build.targets.wheel]
packages = ["helix_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
