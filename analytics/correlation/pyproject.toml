[project]
name = "helix-correlation"
version = "0.1.0"
description = "Lagged correlation between daily metric series and temporal alignment of events to anomaly days"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["helix_correlation"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
